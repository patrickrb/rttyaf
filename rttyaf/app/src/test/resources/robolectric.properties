# targetSdk is 36 (Play compliance) but no released Robolectric (through
# 4.15.1) ships an android-all jar past SDK 35 — without this pin every
# @RunWith(RobolectricTestRunner) class dies in DefaultSdkPicker with
# "Package targetSdkVersion=36 > maxSdkVersion=35". Emulate SDK 35 until a
# Robolectric release supports 36, then delete this file.
sdk=35
