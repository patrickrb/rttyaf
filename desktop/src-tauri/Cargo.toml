[package]
name = "rttyaf"
version = "0.1.0"
edition = "2021"
description = "RTTYAF desktop — Baudot RTTY transceiver client"
license = "GPL-3.0-or-later"

[lib]
name = "rttyaf"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", features = [] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
once_cell = "1"
log = "0.4"
chrono = "0.4"
# audio I/O + resampling
cpal = "0.15"
rubato = "0.15"
ringbuf = "0.4"
# FFT for the live waterfall spectrum
rustfft = "6"
# serial CAT control
serialport = "4"
# HTTP client for FLrig XML-RPC (localhost only — TLS disabled)
ureq = { version = "2", default-features = false }
# dynamic loading of the Hamlib shared library (hamlib-4.dll / libhamlib)
libloading = "0.8"
# persistence (bundled SQLite — no system dependency)
rusqlite = { version = "0.32", features = ["bundled"] }
# async runtime for rig/network helpers
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

# The RTTY modem is pure Rust. Only Tauri context/resources need a build step.
[build-dependencies]
tauri-build = { version = "2", features = [] }
